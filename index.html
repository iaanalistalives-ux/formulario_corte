    } else if (init.headers){
      for (k in init.headers) h[k] = init.headers[k];
    }
    var tiene = false;
    for (k in h) if (k.toLowerCase() === 'authorization') tiene = true;
    if (!tiene && tk) h.Authorization = 'Bearer ' + tk;
    var tieneKey = false;
    for (k in h) if (k.toLowerCase() === 'apikey') tieneKey = true;
    if (!tieneKey) h.apikey = SB_KEY;
    o.headers = h;
    return o;
  }
  window.fetch = function(entrada, init){
    var url = (typeof entrada === 'string') ? entrada : '';
    if (url.indexOf(SB_URL + '/rest/v1/') !== 0) return fetchBase(entrada, init);
    return llave(false).then(function(tk){
      return fetchBase(url, conLlave(init, tk)).then(function(r){
        if (r.status !== 401) return r;
        /* 401: la llave venció o la cerraron. Se renueva una vez y se reintenta. */
        return llave(true).then(function(tk2){
          if (!tk2){ pedirSesion(); return r; }
          return fetchBase(url, conLlave(init, tk2)).then(function(r2){
            if (r2.status === 401) pedirSesion();
            return r2;
          });
        });
      });
    });
  };

  /* ---------- el nombre sale de la sesión, no de la dirección ---------- */
  function fijarNombre(s){
    if (!s || !s.nombre) return;
    try{
      var u = new URL(location.href);
      if (u.searchParams.get('usuario') !== s.nombre){
        u.searchParams.set('usuario', s.nombre);
        u.searchParams.delete('nombre');
        history.replaceState(history.state, '', u.toString());
      }
    }catch(e){}
  }

  /* ---------- aviso de "sin sesión" (21/09: sin formulario propio) ----------
     El portal es la ÚNICA puerta. Esta herramienta nunca pide usuario ni clave: si
     no hay sesión del portal (o quedó vieja/vencida), solo avisa y enlaza de vuelta
     al portal. Entrar ahí es lo único que arregla esto — no hay nada que escribir
     aquí. Esto es a propósito: evita que cada herramienta tenga su propia puerta
     que pueda fallar o quedar desincronizada del portal. */
  function capa(){
    var c = document.getElementById('lsCapa');
    if (c) return c;
    c = document.createElement('div');
    c.id = 'lsCapa';
    c.setAttribute('role', 'dialog');
    c.innerHTML =
      '<div class="lsCaja"><div class="lsCab"><img alt="LIVES" src="' + LOGO + '"></div>' +
      '<div class="lsCuerpo"><div class="lsTit" id="lsTit">Abre esto desde el portal</div>' +
      '<div class="lsSub" id="lsSub">Esta herramienta no tiene su propia entrada. ' +
      'Ve al portal LIVES e inicia sesión ahí; esta pantalla se abre sola en cuanto lo hagas.</div>' +
      '<a class="lsBtn" href="' + PORTAL + '" target="_top">Ir al portal</a></div></div>';
    document.body.appendChild(c);
    return c;
  }

  var pidiendo = false;
  function pedirSesion(){
    if (pidiendo) return;
    pidiendo = true;
    function abrir(){ capa().classList.add('ver'); }
    if (document.body) abrir(); else document.addEventListener('DOMContentLoaded', abrir);
  }

  /* ---------- al abrir ---------- */
  var s0 = sesion();
  if (!s0){
    pedirSesion();
  } else {
    fijarNombre(s0);
    /* Si alguien ejecutó cerrar_todas_las_sesiones(), esta sesión ya no vale. Sin señal
       no se hace nada: nadie queda afuera por falta de conexión. */
    pedir('/rest/v1/rpc/version_sesion', {}, null, 8000).then(function(v){
      if (!v.ok || typeof v.json !== 'number') return;
      var s = sesion(); if (!s) return;
      if (s.vsesion === undefined || (s.vsesion !== null && s.vsesion !== v.json)){ borrar(); pedirSesion(); return; }
      if (s.vsesion === null){ s.vsesion = v.json; guardar(s); }
    }).catch(function(){});
    /* Abierta fuera del portal: se anota igual que cuando se abre desde el portal. */
    if (window.top === window && s0.sb){
      document.addEventListener('DOMContentLoaded', function(){
        llave(false).then(function(tk){
          if (!tk) return;
          return pedir('/rest/v1/rpc/registrar_apertura',
            { p_herramienta: (document.title || location.pathname) + ' (suelta)',
              p_url: location.origin + location.pathname, p_equipo: equipo() }, tk, 10000);
        }).catch(function(){});
      });
    }
  }

  window.LIVES_SESION = {
    version: 'lives-sesion v2 · 2026-09-21 (sin login propio, solo portal)',
    actual: function(){ var s = sesion(); return s ? { usuario: s.usuario, nombre: s.nombre, conSupabase: !!s.sb } : null; },
    llave: function(){ return llave(false); },
    pedir: function(){ pedirSesion(); }
  };
})();
</script>

    <button class="btn-guardar" data-guardar="MANUAL">Guardar registro</button>
    <div class="msg" id="msg-MANUAL"></div>
  </div>

  <!-- ============ CORTE PAÑO ============ -->
  <div class="card seccion" id="sec-CORTE_PAÑO">
    <h2>Corte Paño</h2>
    <div class="dos-cols">
      <div class="campo">
        <label for="cp-codigo1">Colaborador 1</label>
        <select id="cp-codigo1"></select>
      </div>
      <div class="campo">
        <label for="cp-mintrab1">Min. Trabajado 1</label>
        <input type="number" id="cp-mintrab1" min="0" step="1">
      </div>
    </div>
    <div id="cp-op2-wrap" style="margin-top:10px;">
      <button class="quitar-op2" id="cp-agregar-op2" type="button">+ Agregar un segundo colaborador (si trabajaron entre 2)</button>
      <div class="dos-cols" id="cp-op2-campos" style="display:none;margin-top:8px;">
        <div class="campo">
          <label for="cp-codigo2">Colaborador 2</label>
          <select id="cp-codigo2"></select>
        </div>
        <div class="campo">
          <label for="cp-mintrab2">Min. Trabajado 2</label>
          <input type="number" id="cp-mintrab2" min="0" step="1">
        </div>
      </div>
      <button class="quitar-op2" id="cp-quitar-op2" type="button" style="display:none;">Quitar segundo colaborador</button>
    </div>
    <label style="font-size:12px;color:var(--muted);font-weight:600;display:block;margin-top:12px;">Operaciones realizadas</label>
    <div id="cp-ops"></div>
    <button class="quitar-op2" id="cp-agregar-op" type="button">+ Agregar operación</button>
    <button class="btn-guardar" data-guardar="CORTE_PAÑO" style="margin-top:14px;">Guardar registro</button>
    <div class="msg" id="msg-CORTE_PAÑO"></div>
  </div>

  <!-- ============ MODULOS ============ -->
  <div class="card seccion" id="sec-MODULO">
    <h2>Módulo de Corte</h2>
    <div class="campo" style="max-width:220px;margin-bottom:14px;">
      <label for="md-numero">N° de módulo</label>
      <select id="md-numero">
        <option value="MÓD-1">MÓD-1</option>
        <option value="MÓD-2">MÓD-2</option>
        <option value="MÓD-3">MÓD-3</option>
      </select>
    </div>

    <label style="font-size:12px;color:var(--muted);font-weight:600;display:block;">Operarios del módulo (se ingresan 1 sola vez por día, aunque trabajen varios O/C)</label>
    <div id="md-operarios"></div>
    <button class="quitar-op2" id="md-agregar-operario" type="button">+ Agregar operario</button>

    <label style="font-size:12px;color:var(--muted);font-weight:600;display:block;margin-top:16px;">O/C trabajados</label>
    <div id="md-ocs"></div>
    <button class="quitar-op2" id="md-agregar-oc" type="button">+ Agregar O/C</button>

    <label style="font-size:12px;color:var(--muted);font-weight:600;display:block;margin-top:16px;">Operaciones sueltas (opcional -- lo que el módulo haga fuera del corte de pieza)</label>
    <div id="md-operaciones"></div>
    <button class="quitar-op2" id="md-agregar-operacion" type="button">+ Agregar operación</button>

    <button class="btn-guardar" data-guardar="MODULO" style="margin-top:18px;">Guardar registro</button>
    <div class="msg" id="msg-MODULO"></div>
  </div>

  <div class="card">
    <h2>Resultados de esta semana <span id="chip-semana-resumen" style="font-weight:400;color:var(--muted);font-size:12px;"></span></h2>
    <div id="resumen-contenedor"><div class="vacio">Elige una fecha para ver el resumen.</div></div>
  </div>

</main>

<script>

  const $ = id => document.getElementById(id);
  let CATALOGO = { personal: [], operaciones: [] };

  // ------- Supabase (reemplaza al Apps Script; la sesión la pone el bloque lives-sesion) -------
  const SB_URL = 'https://xxfufpddgoyhbotjmaiy.supabase.co';
  const PENDIENTES = {};   // token por guardado: un reintento del mismo guardado no duplica
  function nuevoToken(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)); }
  async function api(accion, p) {
    // Un reintento si falla la red; nunca deja la pantalla bloqueada.
    for (let i = 0; i < 2; i++) {
      try {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
        const r = await fetch(SB_URL + '/rest/v1/rpc/corte_api', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_accion: accion, p: p || {} }), signal: ctl.signal });
        clearTimeout(t);
        const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
        if (r.ok) return j;
        const err = new Error((j && (j.message || j.hint)) || ('Error ' + r.status)); err.servidor = true; throw err;
      } catch (e) {
        if (e.servidor || i === 1) throw (e.servidor ? e : new Error('No hay conexión con la base de datos. Revisa la señal y vuelve a intentar: no se perdió nada de lo escrito.'));
        await new Promise(ok => setTimeout(ok, 1500));
      }
    }
  }
  // Misma forma de respuesta que tenía el Apps Script ({ok, data} / {ok:false, error}).
  async function llamarApi(params) {
    const { action, ...resto } = params; const p = {};
    Object.keys(resto).forEach(k => {
      let v = resto[k];
      if (typeof v === 'string' && /^\s*[\[{]/.test(v)) { try { v = JSON.parse(v); } catch (e) {} }
      if (v !== '' && v !== undefined) p[k] = v;
    });
    if (action.indexOf('guardar') === 0) {
      const firma = JSON.stringify(p);
      if (!PENDIENTES[action] || PENDIENTES[action].firma !== firma) PENDIENTES[action] = { firma, token: nuevoToken() };
      p.token = PENDIENTES[action].token;
    }
    try {
      const data = await api(action, p);
      if (action.indexOf('guardar') === 0) delete PENDIENTES[action];
      if (data && data.personas !== undefined && data.operarios === undefined) data.operarios = data.personas;
      return { ok: true, data };
    } catch (e) { return { ok: false, error: e.message }; }
  }

  // ------- Semana ISO a partir de una fecha (mismo criterio que el Sheet) -------
  function claveSemana(fechaStr) {
    if (!fechaStr) return '';
    const d = new Date(fechaStr + 'T00:00:00Z');
    const dayNum = (d.getUTCDay() || 7);
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return d.getUTCFullYear() + '-W' + (weekNo < 10 ? '0' + weekNo : weekNo);
  }

  function actualizarChipSemana() {
    const semana = claveSemana($('fecha').value);
    $('chip-semana').textContent = semana ? 'Semana ' + semana : 'Semana —';
    $('chip-semana-resumen').textContent = semana ? '· ' + semana : '';
    return semana;
  }

  // ------- Pestañas -------
  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
      document.querySelectorAll('.seccion').forEach(s => s.classList.remove('on'));
      btn.classList.add('on');
      $('sec-' + btn.dataset.tipo).classList.add('on');
    });
  });

  // ------- Poblar selects de código con nombre -------
  function opcionesPersonal(tipo) {
    return CATALOGO.personal
      .filter(p => p.activo !== false && (tipo ? p.tipo === tipo : true))
      .sort((a, b) => a.nombre.localeCompare(b.nombre))
      .map(p => `<option value="${p.codigo}">${p.nombre} (${p.codigo})</option>`).join('');
  }

  function llenarSelectsPersonal() {
    $('m-codigo').innerHTML = '<option value="">-- elegir --</option>' + opcionesPersonal('MANUAL');
    $('cp-codigo1').innerHTML = '<option value="">-- elegir --</option>' + opcionesPersonal('CORTE_PAÑO');
    $('cp-codigo2').innerHTML = '<option value="">-- elegir --</option>' + opcionesPersonal('CORTE_PAÑO');
  }

  // ------- Filas de operación (select operación + cantidad) -------
  function opcionesOperaciones() {
    return '<option value="">-- operación --</option>' + CATALOGO.operaciones
      .map(o => `<option value="${o.codigo}">${o.codigo} — ${o.descripcion} (${o.tstd} ${o.unidad})</option>`).join('');
  }

  // Sin límite de operaciones: arranca con 1 fila, "+ Agregar operación" suma más.
  function agregarFilaOperacion(contenedorId) {
    const cont = $(contenedorId);
    const div = document.createElement('div');
    div.className = 'op-fila';
    div.innerHTML = `<select class="op-select">${opcionesOperaciones()}</select>
                      <input type="number" class="op-cant" placeholder="Cantidad" min="0" step="1">
                      <button class="quitar-op2" type="button" onclick="this.closest('.op-fila').remove();">Quitar</button>`;
    cont.appendChild(div);
  }
  function crearFilasOperacion(contenedorId) {
    $(contenedorId).innerHTML = '';
    agregarFilaOperacion(contenedorId); // arranca con 1
  }

  function leerFilasOperacion(contenedorId) {
    const filas = [];
    $(contenedorId).querySelectorAll('.op-fila').forEach(div => {
      const codigo = div.querySelector('.op-select').value;
      const cantidad = div.querySelector('.op-cant').value;
      if (codigo && cantidad) filas.push({ codigo, cantidad: Number(cantidad) });
    });
    return filas;
  }

  // ------- Corte Paño: mostrar/ocultar segundo operario -------
  $('m-agregar-op').addEventListener('click', () => agregarFilaOperacion('m-ops'));
  $('cp-agregar-op').addEventListener('click', () => agregarFilaOperacion('cp-ops'));

  $('cp-agregar-op2').addEventListener('click', () => {
    $('cp-op2-campos').style.display = 'grid';
    $('cp-agregar-op2').style.display = 'none';
    $('cp-quitar-op2').style.display = 'inline';
  });
  $('cp-quitar-op2').addEventListener('click', () => {
    $('cp-op2-campos').style.display = 'none';
    $('cp-agregar-op2').style.display = 'inline';
    $('cp-quitar-op2').style.display = 'none';
    $('cp-codigo2').value = ''; $('cp-mintrab2').value = '';
  });

  // ------- Módulos: 4 filas de operario -------
  // ------- Módulos: filas dinámicas de operarios -------
  function crearFilaOperarioModulo() {
    const cont = $('md-operarios');
    const n = cont.children.length + 1;
    const div = document.createElement('div');
    div.className = 'modulo-operario';
    div.innerHTML = `<div class="op-num">Operario ${n}</div>
      <div class="dos-cols">
        <select class="md-op-codigo"><option value="">-- elegir --</option>${opcionesPersonal('MODULO')}</select>
        <input type="number" class="md-op-mintrab" placeholder="Min. Trabajado" min="0" step="1">
      </div>
      <div class="campo" style="max-width:220px;margin-top:8px;">
        <input type="number" class="md-op-improd" placeholder="Min. Improductivo" min="0" step="1" value="0">
      </div>
      <button class="quitar-op2" type="button" onclick="this.closest('.modulo-operario').remove(); renumerarOperariosModulo();">Quitar</button>`;
    cont.appendChild(div);
  }
  function renumerarOperariosModulo() {
    $('md-operarios').querySelectorAll('.op-num').forEach((el, idx) => { el.textContent = 'Operario ' + (idx + 1); });
  }
  function crearFilasModuloInicial() {
    $('md-operarios').innerHTML = '';
    crearFilaOperarioModulo(); // arranca con 1, se agregan más con el botón

    $('md-ocs').innerHTML = '';
    crearFilaOCModulo();

    $('md-operaciones').innerHTML = '';
  }

  // ------- Módulos: filas dinámicas de O/C -------
  function crearFilaOCModulo() {
    const cont = $('md-ocs');
    const div = document.createElement('div');
    div.className = 'modulo-operario';
    div.innerHTML = `<div class="dos-cols">
        <input type="text" class="md-oc-numero" placeholder="O/C, ej. 51375">
        <input type="text" class="md-oc-estilo" placeholder="Estilo, ej. 22710">
      </div>
      <div class="dos-cols" style="margin-top:8px;">
        <input type="number" class="md-oc-cant" placeholder="Cantidad de prendas" min="0" step="1">
        <input type="number" class="md-oc-tstd" placeholder="T.Std corte pieza (min/pza)" min="0" step="0.01">
      </div>
      <button class="quitar-op2" type="button" onclick="this.closest('.modulo-operario').remove();">Quitar</button>`;
    cont.appendChild(div);
  }

  // ------- Módulos: filas dinámicas de operaciones sueltas -------
  function crearFilaOperacionModulo() {
    const cont = $('md-operaciones');
    const div = document.createElement('div');
    div.className = 'op-fila';
    div.innerHTML = `<select class="md-op-op-select">${opcionesOperaciones()}</select>
                      <input type="number" class="md-op-op-cant" placeholder="Cantidad" min="0" step="1">
                      <button class="quitar-op2" type="button" onclick="this.closest('.op-fila').remove();">Quitar</button>`;
    cont.appendChild(div);
  }

  $('md-agregar-operario').addEventListener('click', () => { crearFilaOperarioModulo(); renumerarOperariosModulo(); });
  $('md-agregar-oc').addEventListener('click', crearFilaOCModulo);
  $('md-agregar-operacion').addEventListener('click', crearFilaOperacionModulo);

  // ------- Mostrar mensaje -------
  function mostrarMsg(tipo, ok, texto) {
    const el = $('msg-' + tipo);
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = texto;
    setTimeout(() => { el.className = 'msg'; }, 6000);
  }

  // ------- Guardar: MANUAL -------
  async function guardarManual() {
    const fecha = $('fecha').value, codigo = $('m-codigo').value;
    const minTrabajado = $('m-mintrab').value;
    const ops = leerFilasOperacion('m-ops');
    if (!fecha || !codigo || !minTrabajado || ops.length === 0) {
      mostrarMsg('MANUAL', false, 'Falta fecha, colaborador, minutos trabajados o al menos una operación.');
      return;
    }
    const btn = document.querySelector('[data-guardar="MANUAL"]'); btn.disabled = true;
    try {
      const res = await llamarApi({ action: 'guardarManual', fecha, codigo, minTrabajado, ops: JSON.stringify(ops) });
      if (res.ok) {
        mostrarMsg('MANUAL', true, 'Guardado correctamente · registro N° ' + res.data.id + (res.data.repetido ? ' (ya estaba guardado)' : '') + '.');
        $('m-codigo').value = ''; $('m-mintrab').value = ''; crearFilasOperacion('m-ops');
        cargarResumenSemana();
      } else { mostrarMsg('MANUAL', false, 'Error: ' + res.error); }
    } catch (e) { mostrarMsg('MANUAL', false, 'Error de conexión: ' + e.message); }
    btn.disabled = false;
  }

  // ------- Guardar: CORTE_PAÑO -------
  async function guardarCortePano() {
    const fecha = $('fecha').value, codigo1 = $('cp-codigo1').value, minTrab1 = $('cp-mintrab1').value;
    const codigo2 = $('cp-codigo2').value, minTrab2 = $('cp-mintrab2').value;
    const ops = leerFilasOperacion('cp-ops');
    if (!fecha || !codigo1 || !minTrab1 || ops.length === 0) {
      mostrarMsg('CORTE_PAÑO', false, 'Falta fecha, colaborador 1, sus minutos trabajados, u operaciones.');
      return;
    }
    const btn = document.querySelector('[data-guardar="CORTE_PAÑO"]'); btn.disabled = true;
    try {
      const res = await llamarApi({
        action: 'guardarCortePano', fecha, codigo1, minTrab1,
        codigo2: codigo2 || '', minTrab2: minTrab2 || '', ops: JSON.stringify(ops)
      });
      if (res.ok) {
        mostrarMsg('CORTE_PAÑO', true, 'Guardado correctamente · registro N° ' + res.data.id + (res.data.repetido ? ' (ya estaba guardado)' : '') + '.');
        $('cp-codigo1').value = ''; $('cp-mintrab1').value = '';
        $('cp-codigo2').value = ''; $('cp-mintrab2').value = '';
        $('cp-quitar-op2').click();
        crearFilasOperacion('cp-ops');
        cargarResumenSemana();
      } else { mostrarMsg('CORTE_PAÑO', false, 'Error: ' + res.error); }
    } catch (e) { mostrarMsg('CORTE_PAÑO', false, 'Error de conexión: ' + e.message); }
    btn.disabled = false;
  }

  // ------- Guardar: MODULO -------
  async function guardarModulo() {
    const fecha = $('fecha').value, modulo = $('md-numero').value;

    const operarios = [];
    document.querySelectorAll('#md-operarios .modulo-operario').forEach(div => {
      const codigo = div.querySelector('.md-op-codigo').value;
      const minTrabajado = div.querySelector('.md-op-mintrab').value;
      const minImproductivo = div.querySelector('.md-op-improd').value || 0;
      if (codigo && minTrabajado) operarios.push({ codigo, minTrabajado: Number(minTrabajado), minImproductivo: Number(minImproductivo) });
    });

    const ocs = [];
    document.querySelectorAll('#md-ocs .modulo-operario').forEach(div => {
      const oc = div.querySelector('.md-oc-numero').value;
      const estilo = div.querySelector('.md-oc-estilo').value;
      const cantPrendas = div.querySelector('.md-oc-cant').value;
      const tstd = div.querySelector('.md-oc-tstd').value;
      if (oc && estilo && cantPrendas && tstd) ocs.push({ oc, estilo, cantPrendas: Number(cantPrendas), tstd: Number(tstd) });
    });

    const operaciones = [];
    document.querySelectorAll('#md-operaciones .op-fila').forEach(div => {
      const codigo = div.querySelector('.md-op-op-select').value;
      const cantidad = div.querySelector('.md-op-op-cant').value;
      if (codigo && cantidad) operaciones.push({ codigo, cantidad: Number(cantidad) });
    });

    if (!fecha || !modulo || operarios.length === 0 || ocs.length === 0) {
      mostrarMsg('MODULO', false, 'Completa la fecha, el módulo, al menos 1 operario (con sus minutos) y al menos 1 O/C.');
      return;
    }
    const btn = document.querySelector('[data-guardar="MODULO"]'); btn.disabled = true;
    try {
      const res = await llamarApi({
        action: 'guardarModulo', fecha, modulo,
        operarios: JSON.stringify(operarios), ocs: JSON.stringify(ocs), operaciones: JSON.stringify(operaciones)
      });
      if (res.ok) {
        mostrarMsg('MODULO', true, res.data.repetido ? `Ya estaba guardado · registro N° ${res.data.id}.` : `Guardado correctamente · registro N° ${res.data.id} (${res.data.operarios} operarios, ${res.data.ocs} O/C, ${res.data.operaciones} operaciones).`);
        crearFilasModuloInicial();
        cargarResumenSemana();
      } else { mostrarMsg('MODULO', false, 'Error: ' + res.error); }
    } catch (e) { mostrarMsg('MODULO', false, 'Error de conexión: ' + e.message); }
    btn.disabled = false;
  }

  document.querySelector('[data-guardar="MANUAL"]').addEventListener('click', guardarManual);
  document.querySelector('[data-guardar="CORTE_PAÑO"]').addEventListener('click', guardarCortePano);
  document.querySelector('[data-guardar="MODULO"]').addEventListener('click', guardarModulo);

  // ------- Resumen semanal en vivo -------
  async function cargarResumenSemana() {
    const fecha = $('fecha').value;
    if (!fecha) return;
    const cont = $('resumen-contenedor');
    cont.innerHTML = '<div class="vacio">Cargando…</div>';
    try {
      const res = await llamarApi({ action: 'resumenSemana', fecha });
      if (!res.ok) { cont.innerHTML = '<div class="vacio">Error al cargar el resumen.</div>'; return; }
      const filas = res.data.filas;
      if (!filas.length) { cont.innerHTML = '<div class="vacio">Todavía no hay registros guardados esta semana.</div>'; return; }
      let html = `<table class="resumen"><thead><tr>
        <th>Colaborador</th><th>Días</th><th>Min.Prod</th><th>Min.Trab</th>
        <th>EF Real</th><th>EF Sistema</th><th>Inc. Real S/</th><th>Inc. Sistema S/</th><th>Dif. S/</th>
      </tr></thead><tbody>`;
      filas.sort((a, b) => a.nombre.localeCompare(b.nombre)).forEach(f => {
        const claseEf = f.efReal >= 55 ? 'ef-alta' : 'ef-baja';
        html += `<tr>
          <td>${f.nombre}</td><td>${f.diasTrabajados}</td>
          <td>${Math.round(f.minProducido)}</td><td>${Math.round(f.minTrabajado)}</td>
          <td class="${claseEf}">${f.efReal.toFixed(1)}%</td><td>${(f.efSist || 0).toFixed(1)}%</td>
          <td>${f.incReal.toFixed(2)}</td><td>${f.incSist.toFixed(2)}</td>
          <td>${f.diferencia >= 0 ? '+' : ''}${f.diferencia.toFixed(2)}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      cont.innerHTML = html;
    } catch (e) {
      cont.innerHTML = '<div class="vacio">Error de conexión al cargar el resumen.</div>';
    }
  }

  $('fecha').addEventListener('change', () => { actualizarChipSemana(); cargarResumenSemana(); });

  // ------- Inicialización -------
  async function iniciar() {
    const hoy = new Date();
    hoy.setMinutes(hoy.getMinutes() - hoy.getTimezoneOffset());   // fecha local, no UTC
    $('fecha').value = hoy.toISOString().slice(0, 10);
    actualizarChipSemana();

    crearFilasOperacion('m-ops');
    crearFilasOperacion('cp-ops');
    crearFilasModuloInicial();

    try {
      const res = await llamarApi({ action: 'listas' });
      if (res.ok) {
        CATALOGO = res.data;
        llenarSelectsPersonal();
        crearFilasOperacion('m-ops');
        crearFilasOperacion('cp-ops');
        crearFilasModuloInicial();
      }
    } catch (e) {
      console.error('No se pudo cargar el catálogo:', e);
    }
    cargarResumenSemana();
  }
  iniciar();

</script>
</body>
</html>
