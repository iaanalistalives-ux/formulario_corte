<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corte — Registro diario | LIVES</title>
<style>
  :root{
    --petroleo:#0E3B36; --esmeralda:#10B981; --salvia:#0F7A5A;
    --bg:#F1F6F4; --card:#FFFFFF; --ink:#1C2B28; --muted:#6B7C78;
    --border:#E1E9E6; --warn:#B45309; --warn-bg:#FEF3E2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--petroleo);border-bottom:3px solid var(--esmeralda);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header .titulo{color:#fff;font-size:15px;font-weight:600;opacity:.92;}
  main{max-width:960px;margin:0 auto;padding:20px 16px 60px;}
  .card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(14,59,54,.08);padding:18px 20px;margin-bottom:18px;}
  .card h2{margin:0 0 12px;font-size:15px;color:var(--petroleo);}
  .fila-fecha{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;}
  .campo{display:flex;flex-direction:column;gap:4px;}
  .campo label{font-size:12px;color:var(--muted);font-weight:600;}
  input,select{padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--salvia);outline-offset:1px;}
  .semana-chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:13px;color:var(--petroleo);font-weight:600;}
  .tabs{display:flex;gap:8px;margin:18px 0 4px;flex-wrap:wrap;}
  .tabs button{flex:1;min-width:140px;padding:11px 8px;border:1px solid var(--border);background:#fff;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;}
  .tabs button.on{background:var(--salvia);border-color:var(--salvia);color:#fff;}
  .seccion{display:none;}
  .seccion.on{display:block;}
  .op-fila{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:8px;}
  .op-fila select,.op-fila input{width:100%;}
  .dos-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .btn-guardar{width:100%;padding:13px;background:var(--salvia);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;}
  .btn-guardar:disabled{opacity:.5;cursor:default;}
  .btn-guardar:hover:not(:disabled){filter:brightness(1.06);}
  .msg{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:13px;display:none;}
  .msg.ok{background:#E7F6EF;color:var(--salvia);display:block;}
  .msg.err{background:var(--warn-bg);color:var(--warn);display:block;}
  .modulo-operario{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg);}
  .modulo-operario .op-num{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;}
  table.resumen{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.resumen th{background:var(--bg);color:var(--petroleo);text-align:left;padding:7px 8px;font-weight:700;border-bottom:2px solid var(--border);}
  table.resumen td{padding:7px 8px;border-bottom:1px solid var(--border);}
  table.resumen tr:hover td{background:#FAFCFB;}
  .ef-alta{color:var(--salvia);font-weight:700;}
  .ef-baja{color:var(--warn);font-weight:700;}
  .vacio{color:var(--muted);font-size:13px;padding:10px 0;text-align:center;}
  .quitar-op2{background:none;border:none;color:var(--warn);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;margin-top:4px;}
  small.ayuda{color:var(--muted);font-size:11.5px;}
</style>
</head>

<main>

  <div class="card">
    <h2>Fecha del registro</h2>
    <div class="fila-fecha">
      <div class="campo">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div class="semana-chip" id="chip-semana">Semana —</div>
    </div>
  </div>

  <div class="tabs">
    <button class="on" data-tipo="MANUAL">Manual de Corte</button>
    <button data-tipo="CORTE_PAÑO">Corte Paño</button>
    <button data-tipo="MODULO">Módulos</button>
  </div>

  <!-- ============ MANUAL DE CORTE ============ -->
  <div class="card seccion on" id="sec-MANUAL">
    <h2>Manual de Corte</h2>
    <div class="campo" style="margin-bottom:12px;">
      <label for="m-codigo">Colaborador</label>
      <select id="m-codigo"></select>
    </div>
    <label style="font-size:12px;color:var(--muted);font-weight:600;">Operaciones realizadas</label>
    <div id="m-ops"></div>
    <div class="campo" style="max-width:220px;margin-top:10px;">
      <label for="m-mintrab">Min. Trabajado (real)</label>
      <input type="number" id="m-mintrab" min="0" step="1">
      <small class="ayuda">Tu estimación real, distinta de lo que marca el sistema.</small>
    </div>
    <button class="btn-guardar" data-guardar="MANUAL">Guardar registro</button>
    <div class="msg" id="msg-MANUAL"></div>
  </div>

  <!-- ============ CORTE PAÑO ============ -->
  <div class="card seccion" id="sec-CORTE_PAÑO">
    <h2>Corte Paño</h2>
    <div class="dos-cols">
      <div class="campo">
        <label for="cp-codigo1">Colaborador 1</label>
        <select id="cp-codigo1"></select>
      </div>
      <div class="campo">
        <label for="cp-mintrab1">Min. Trabajado 1</label>
        <input type="number" id="cp-mintrab1" min="0" step="1">
      </div>
    </div>
    <div id="cp-op2-wrap" style="margin-top:10px;">
      <button class="quitar-op2" id="cp-agregar-op2" type="button">+ Agregar un segundo colaborador (si trabajaron entre 2)</button>
      <div class="dos-cols" id="cp-op2-campos" style="display:none;margin-top:8px;">
        <div class="campo">
          <label for="cp-codigo2">Colaborador 2</label>
          <select id="cp-codigo2"></select>
        </div>
        <div class="campo">
          <label for="cp-mintrab2">Min. Trabajado 2</label>
          <input type="number" id="cp-mintrab2" min="0" step="1">
        </div>
      </div>
      <button class="quitar-op2" id="cp-quitar-op2" type="button" style="display:none;">Quitar segundo colaborador</button>
    </div>
    <label style="font-size:12px;color:var(--muted);font-weight:600;display:block;margin-top:12px;">Operaciones realizadas</label>
    <div id="cp-ops"></div>
    <button class="btn-guardar" data-guardar="CORTE_PAÑO">Guardar registro</button>
    <div class="msg" id="msg-CORTE_PAÑO"></div>
  </div>

  <!-- ============ MODULOS ============ -->
  <div class="card seccion" id="sec-MODULO">
    <h2>Módulo de Corte (4 operarios)</h2>
    <div class="dos-cols">
      <div class="campo">
        <label for="md-oc">O/C</label>
        <input type="text" id="md-oc" placeholder="ej. 51375">
      </div>
      <div class="campo">
        <label for="md-estilo">Estilo</label>
        <input type="text" id="md-estilo" placeholder="ej. 22710">
      </div>
    </div>
    <div class="dos-cols" style="margin-top:10px;">
      <div class="campo">
        <label for="md-cant">Cantidad de prendas</label>
        <input type="number" id="md-cant" min="0" step="1">
      </div>
      <div class="campo">
        <label for="md-tstd">T.Std corte pieza (min/pza)</label>
        <input type="number" id="md-tstd" min="0" step="0.01">
      </div>
    </div>
    <div class="campo" style="max-width:260px;margin-top:10px;">
      <label for="md-improd">Min. Improductivos (del bloque)</label>
      <input type="number" id="md-improd" min="0" step="1" value="0">
    </div>

    <label style="font-size:12px;color:var(--muted);font-weight:600;display:block;margin-top:14px;">Los 4 operarios del módulo</label>
    <div id="md-operarios"></div>

    <button class="btn-guardar" data-guardar="MODULO">Guardar registro</button>
    <div class="msg" id="msg-MODULO"></div>
  </div>

  <div class="card">
    <h2>Resultados de esta semana <span id="chip-semana-resumen" style="font-weight:400;color:var(--muted);font-size:12px;"></span></h2>
    <div id="resumen-contenedor"><div class="vacio">Elige una fecha para ver el resumen.</div></div>
  </div>

</main>

<script>
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwQ4UNwZS222_R5HvlYV8rOTKEg0A9xMwEhFM6NbBJT05ggc-7DuAaIvFHG9saSh97U/exec';

  const $ = id => document.getElementById(id);
  let CATALOGO = { personal: [], operaciones: [] };
  let jsonpContador = 0;

  // ------- JSONP helper (mismo patrón que Acabados: evita problemas de CORS) -------
  function llamarApi(params) {
    return new Promise((resolve, reject) => {
      const cbName = 'cb_' + (jsonpContador++) + '_' + Date.now();
      const script = document.createElement('script');
      window[cbName] = (res) => {
        resolve(res);
        delete window[cbName];
        script.remove();
      };
      const qs = new URLSearchParams({ ...params, callback: cbName }).toString();
      script.src = WEBAPP_URL + '?' + qs;
      script.onerror = () => { reject(new Error('Error de red al llamar la API')); delete window[cbName]; script.remove(); };
      document.body.appendChild(script);
      setTimeout(() => { if (window[cbName]) { reject(new Error('Tiempo de espera agotado')); delete window[cbName]; script.remove(); } }, 15000);
    });
  }

  // ------- Semana ISO a partir de una fecha (mismo criterio que el Sheet) -------
  function claveSemana(fechaStr) {
    if (!fechaStr) return '';
    const d = new Date(fechaStr + 'T00:00:00Z');
    const dayNum = (d.getUTCDay() || 7);
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return d.getUTCFullYear() + '-W' + (weekNo < 10 ? '0' + weekNo : weekNo);
  }

  function actualizarChipSemana() {
    const semana = claveSemana($('fecha').value);
    $('chip-semana').textContent = semana ? 'Semana ' + semana : 'Semana —';
    $('chip-semana-resumen').textContent = semana ? '· ' + semana : '';
    return semana;
  }

  // ------- Pestañas -------
  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
      document.querySelectorAll('.seccion').forEach(s => s.classList.remove('on'));
      btn.classList.add('on');
      $('sec-' + btn.dataset.tipo).classList.add('on');
    });
  });

  // ------- Poblar selects de código con nombre -------
  function opcionesPersonal(tipo) {
    return CATALOGO.personal
      .filter(p => tipo ? p.tipo === tipo : true)
      .sort((a, b) => a.nombre.localeCompare(b.nombre))
      .map(p => `<option value="${p.codigo}">${p.nombre} (${p.codigo})</option>`).join('');
  }

  function llenarSelectsPersonal() {
    $('m-codigo').innerHTML = '<option value="">-- elegir --</option>' + opcionesPersonal('MANUAL');
    $('cp-codigo1').innerHTML = '<option value="">-- elegir --</option>' + opcionesPersonal('CORTE_PAÑO');
    $('cp-codigo2').innerHTML = '<option value="">-- elegir --</option>' + opcionesPersonal('CORTE_PAÑO');
  }

  // ------- Filas de operación (select operación + cantidad) -------
  function opcionesOperaciones() {
    return '<option value="">-- operación --</option>' + CATALOGO.operaciones
      .map(o => `<option value="${o.codigo}">${o.codigo} — ${o.descripcion} (${o.tstd} ${o.unidad})</option>`).join('');
  }

  function crearFilasOperacion(contenedorId, cantidad) {
    const cont = $(contenedorId);
    cont.innerHTML = '';
    for (let i = 0; i < cantidad; i++) {
      const div = document.createElement('div');
      div.className = 'op-fila';
      div.innerHTML = `<select class="op-select">${opcionesOperaciones()}</select>
                        <input type="number" class="op-cant" placeholder="Cantidad" min="0" step="1">`;
      cont.appendChild(div);
    }
  }

  function leerFilasOperacion(contenedorId) {
    const filas = [];
    $(contenedorId).querySelectorAll('.op-fila').forEach(div => {
      const codigo = div.querySelector('.op-select').value;
      const cantidad = div.querySelector('.op-cant').value;
      if (codigo && cantidad) filas.push({ codigo, cantidad: Number(cantidad) });
    });
    return filas;
  }

  // ------- Corte Paño: mostrar/ocultar segundo operario -------
  $('cp-agregar-op2').addEventListener('click', () => {
    $('cp-op2-campos').style.display = 'grid';
    $('cp-agregar-op2').style.display = 'none';
    $('cp-quitar-op2').style.display = 'inline';
  });
  $('cp-quitar-op2').addEventListener('click', () => {
    $('cp-op2-campos').style.display = 'none';
    $('cp-agregar-op2').style.display = 'inline';
    $('cp-quitar-op2').style.display = 'none';
    $('cp-codigo2').value = ''; $('cp-mintrab2').value = '';
  });

  // ------- Módulos: 4 filas de operario -------
  function crearFilasModulo() {
    const cont = $('md-operarios');
    cont.innerHTML = '';
    for (let i = 1; i <= 4; i++) {
      const div = document.createElement('div');
      div.className = 'modulo-operario';
      div.innerHTML = `<div class="op-num">Operario ${i}</div>
        <div class="dos-cols">
          <select class="md-op-codigo"><option value="">-- elegir --</option>${opcionesPersonal('MODULO')}</select>
          <input type="number" class="md-op-mintrab" placeholder="Min. Trabajado" min="0" step="1">
        </div>`;
      cont.appendChild(div);
    }
  }

  // ------- Mostrar mensaje -------
  function mostrarMsg(tipo, ok, texto) {
    const el = $('msg-' + tipo);
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = texto;
    setTimeout(() => { el.className = 'msg'; }, 6000);
  }

  // ------- Guardar: MANUAL -------
  async function guardarManual() {
    const fecha = $('fecha').value, codigo = $('m-codigo').value;
    const minTrabajado = $('m-mintrab').value;
    const ops = leerFilasOperacion('m-ops');
    if (!fecha || !codigo || !minTrabajado || ops.length === 0) {
      mostrarMsg('MANUAL', false, 'Falta fecha, colaborador, minutos trabajados o al menos una operación.');
      return;
    }
    const btn = document.querySelector('[data-guardar="MANUAL"]'); btn.disabled = true;
    try {
      const res = await llamarApi({ action: 'guardarManual', fecha, codigo, minTrabajado, ops: JSON.stringify(ops) });
      if (res.ok) {
        mostrarMsg('MANUAL', true, 'Guardado correctamente.');
        $('m-codigo').value = ''; $('m-mintrab').value = ''; crearFilasOperacion('m-ops', 5);
        cargarResumenSemana();
      } else { mostrarMsg('MANUAL', false, 'Error: ' + res.error); }
    } catch (e) { mostrarMsg('MANUAL', false, 'Error de conexión: ' + e.message); }
    btn.disabled = false;
  }

  // ------- Guardar: CORTE_PAÑO -------
  async function guardarCortePano() {
    const fecha = $('fecha').value, codigo1 = $('cp-codigo1').value, minTrab1 = $('cp-mintrab1').value;
    const codigo2 = $('cp-codigo2').value, minTrab2 = $('cp-mintrab2').value;
    const ops = leerFilasOperacion('cp-ops');
    if (!fecha || !codigo1 || !minTrab1 || ops.length === 0) {
      mostrarMsg('CORTE_PAÑO', false, 'Falta fecha, colaborador 1, sus minutos trabajados, u operaciones.');
      return;
    }
    const btn = document.querySelector('[data-guardar="CORTE_PAÑO"]'); btn.disabled = true;
    try {
      const res = await llamarApi({
        action: 'guardarCortePano', fecha, codigo1, minTrab1,
        codigo2: codigo2 || '', minTrab2: minTrab2 || '', ops: JSON.stringify(ops)
      });
      if (res.ok) {
        mostrarMsg('CORTE_PAÑO', true, 'Guardado correctamente.');
        $('cp-codigo1').value = ''; $('cp-mintrab1').value = '';
        $('cp-codigo2').value = ''; $('cp-mintrab2').value = '';
        $('cp-quitar-op2').click();
        crearFilasOperacion('cp-ops', 3);
        cargarResumenSemana();
      } else { mostrarMsg('CORTE_PAÑO', false, 'Error: ' + res.error); }
    } catch (e) { mostrarMsg('CORTE_PAÑO', false, 'Error de conexión: ' + e.message); }
    btn.disabled = false;
  }

  // ------- Guardar: MODULO -------
  async function guardarModulo() {
    const fecha = $('fecha').value, oc = $('md-oc').value, estilo = $('md-estilo').value;
    const cantPrendas = $('md-cant').value, tstd = $('md-tstd').value, minImproductivos = $('md-improd').value || 0;
    const operarios = [];
    document.querySelectorAll('#md-operarios .modulo-operario').forEach(div => {
      const codigo = div.querySelector('.md-op-codigo').value;
      const minTrabajado = div.querySelector('.md-op-mintrab').value;
      if (codigo && minTrabajado) operarios.push({ codigo, minTrabajado: Number(minTrabajado) });
    });
    if (!fecha || !oc || !estilo || !cantPrendas || !tstd || operarios.length === 0) {
      mostrarMsg('MODULO', false, 'Completa O/C, estilo, cantidad, T.std, y al menos un operario con sus minutos.');
      return;
    }
    const btn = document.querySelector('[data-guardar="MODULO"]'); btn.disabled = true;
    try {
      const res = await llamarApi({
        action: 'guardarModulo', fecha, oc, estilo, cantPrendas, tstd, minImproductivos,
        operarios: JSON.stringify(operarios)
      });
      if (res.ok) {
        mostrarMsg('MODULO', true, 'Guardado correctamente (' + res.data.filas.length + ' operarios).');
        $('md-oc').value = ''; $('md-estilo').value = ''; $('md-cant').value = ''; $('md-tstd').value = ''; $('md-improd').value = '0';
        crearFilasModulo();
        cargarResumenSemana();
      } else { mostrarMsg('MODULO', false, 'Error: ' + res.error); }
    } catch (e) { mostrarMsg('MODULO', false, 'Error de conexión: ' + e.message); }
    btn.disabled = false;
  }

  document.querySelector('[data-guardar="MANUAL"]').addEventListener('click', guardarManual);
  document.querySelector('[data-guardar="CORTE_PAÑO"]').addEventListener('click', guardarCortePano);
  document.querySelector('[data-guardar="MODULO"]').addEventListener('click', guardarModulo);

  // ------- Resumen semanal en vivo -------
  async function cargarResumenSemana() {
    const fecha = $('fecha').value;
    if (!fecha) return;
    const cont = $('resumen-contenedor');
    cont.innerHTML = '<div class="vacio">Cargando…</div>';
    try {
      const res = await llamarApi({ action: 'resumenSemana', fecha });
      if (!res.ok) { cont.innerHTML = '<div class="vacio">Error al cargar el resumen.</div>'; return; }
      const filas = res.data.filas;
      if (!filas.length) { cont.innerHTML = '<div class="vacio">Todavía no hay registros guardados esta semana.</div>'; return; }
      let html = `<table class="resumen"><thead><tr>
        <th>Colaborador</th><th>Días</th><th>Min.Prod</th><th>Min.Trab</th>
        <th>EF Real</th><th>EF Sistema</th><th>Inc. Real S/</th><th>Inc. Sistema S/</th><th>Dif. S/</th>
      </tr></thead><tbody>`;
      filas.sort((a, b) => a.nombre.localeCompare(b.nombre)).forEach(f => {
        const claseEf = f.efReal >= 55 ? 'ef-alta' : 'ef-baja';
        html += `<tr>
          <td>${f.nombre}</td><td>${f.diasTrabajados}</td>
          <td>${Math.round(f.minProducido)}</td><td>${Math.round(f.minTrabajado)}</td>
          <td class="${claseEf}">${f.efReal.toFixed(1)}%</td><td>${(f.efSist || 0).toFixed(1)}%</td>
          <td>${f.incReal.toFixed(2)}</td><td>${f.incSist.toFixed(2)}</td>
          <td>${f.diferencia >= 0 ? '+' : ''}${f.diferencia.toFixed(2)}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      cont.innerHTML = html;
    } catch (e) {
      cont.innerHTML = '<div class="vacio">Error de conexión al cargar el resumen.</div>';
    }
  }

  $('fecha').addEventListener('change', () => { actualizarChipSemana(); cargarResumenSemana(); });

  // ------- Inicialización -------
  async function iniciar() {
    const hoy = new Date();
    $('fecha').value = hoy.toISOString().slice(0, 10);
    actualizarChipSemana();

    crearFilasOperacion('m-ops', 5);
    crearFilasOperacion('cp-ops', 3);
    crearFilasModulo();

    try {
      const res = await llamarApi({ action: 'listas' });
      if (res.ok) {
        CATALOGO = res.data;
        llenarSelectsPersonal();
        crearFilasOperacion('m-ops', 5);
        crearFilasOperacion('cp-ops', 3);
        crearFilasModulo();
      }
    } catch (e) {
      console.error('No se pudo cargar el catálogo:', e);
    }
    cargarResumenSemana();
  }
  iniciar();

</script>
</body>
</html>
