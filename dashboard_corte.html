    } else if (init.headers){
      for (k in init.headers) h[k] = init.headers[k];
    }
    var tiene = false;
    for (k in h) if (k.toLowerCase() === 'authorization') tiene = true;
    if (!tiene && tk) h.Authorization = 'Bearer ' + tk;
    var tieneKey = false;
    for (k in h) if (k.toLowerCase() === 'apikey') tieneKey = true;
    if (!tieneKey) h.apikey = SB_KEY;
    o.headers = h;
    return o;
  }
  window.fetch = function(entrada, init){
    var url = (typeof entrada === 'string') ? entrada : '';
    if (url.indexOf(SB_URL + '/rest/v1/') !== 0) return fetchBase(entrada, init);
    return llave(false).then(function(tk){
      return fetchBase(url, conLlave(init, tk)).then(function(r){
        if (r.status !== 401) return r;
        /* 401: la llave venció o la cerraron. Se renueva una vez y se reintenta. */
        return llave(true).then(function(tk2){
          if (!tk2){ pedirSesion(); return r; }
          return fetchBase(url, conLlave(init, tk2)).then(function(r2){
            if (r2.status === 401) pedirSesion();
            return r2;
          });
        });
      });
    });
  };

  /* ---------- el nombre sale de la sesión, no de la dirección ---------- */
  function fijarNombre(s){
    if (!s || !s.nombre) return;
    try{
      var u = new URL(location.href);
      if (u.searchParams.get('usuario') !== s.nombre){
        u.searchParams.set('usuario', s.nombre);
        u.searchParams.delete('nombre');
        history.replaceState(history.state, '', u.toString());
      }
    }catch(e){}
  }

  /* ---------- aviso de "sin sesión" (21/09: sin formulario propio) ----------
     El portal es la ÚNICA puerta. Esta herramienta nunca pide usuario ni clave: si
     no hay sesión del portal (o quedó vieja/vencida), solo avisa y enlaza de vuelta
     al portal. Entrar ahí es lo único que arregla esto — no hay nada que escribir
     aquí. Esto es a propósito: evita que cada herramienta tenga su propia puerta
     que pueda fallar o quedar desincronizada del portal. */
  function capa(){
    var c = document.getElementById('lsCapa');
    if (c) return c;
    c = document.createElement('div');
    c.id = 'lsCapa';
    c.setAttribute('role', 'dialog');
    c.innerHTML =
      '<div class="lsCaja"><div class="lsCab"><img alt="LIVES" src="' + LOGO + '"></div>' +
      '<div class="lsCuerpo"><div class="lsTit" id="lsTit">Abre esto desde el portal</div>' +
      '<div class="lsSub" id="lsSub">Esta herramienta no tiene su propia entrada. ' +
      'Ve al portal LIVES e inicia sesión ahí; esta pantalla se abre sola en cuanto lo hagas.</div>' +
      '<a class="lsBtn" href="' + PORTAL + '" target="_top">Ir al portal</a></div></div>';
    document.body.appendChild(c);
    return c;
  }

  var pidiendo = false;
  function pedirSesion(){
    if (pidiendo) return;
    pidiendo = true;
    function abrir(){ capa().classList.add('ver'); }
    if (document.body) abrir(); else document.addEventListener('DOMContentLoaded', abrir);
  }

  /* ---------- al abrir ---------- */
  var s0 = sesion();
  if (!s0){
    pedirSesion();
  } else {
    fijarNombre(s0);
    /* Si alguien ejecutó cerrar_todas_las_sesiones(), esta sesión ya no vale. Sin señal
       no se hace nada: nadie queda afuera por falta de conexión. */
    pedir('/rest/v1/rpc/version_sesion', {}, null, 8000).then(function(v){
      if (!v.ok || typeof v.json !== 'number') return;
      var s = sesion(); if (!s) return;
      if (s.vsesion === undefined || (s.vsesion !== null && s.vsesion !== v.json)){ borrar(); pedirSesion(); return; }
      if (s.vsesion === null){ s.vsesion = v.json; guardar(s); }
    }).catch(function(){});
    /* Abierta fuera del portal: se anota igual que cuando se abre desde el portal. */
    if (window.top === window && s0.sb){
      document.addEventListener('DOMContentLoaded', function(){
        llave(false).then(function(tk){
          if (!tk) return;
          return pedir('/rest/v1/rpc/registrar_apertura',
            { p_herramienta: (document.title || location.pathname) + ' (suelta)',
              p_url: location.origin + location.pathname, p_equipo: equipo() }, tk, 10000);
        }).catch(function(){});
      });
    }
  }

  window.LIVES_SESION = {
    version: 'lives-sesion v2 · 2026-09-21 (sin login propio, solo portal)',
    actual: function(){ var s = sesion(); return s ? { usuario: s.usuario, nombre: s.nombre, conSupabase: !!s.sb } : null; },
    llave: function(){ return llave(false); },
    pedir: function(){ pedirSesion(); }
  };
})();
</script>

<title>Dashboard Corte | LIVES</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --petrol:#0E3B36; --petrol-2:#12463F; --emer:#10B981; --sage:#0F7A5A; --sage-dark:#0B815E;
  --slate:#4E6B78; --taupe:#B45309; --rose:#DC2626; --tan:#F59E0B;
  --warm:#DCE5E2; --warm-light:#F1F6F4; --stone:#5F726C;
  --card:#fff; --sh:0 1px 3px rgba(14,59,54,.06),0 1px 2px rgba(14,59,54,.04);
  --sh-h:0 4px 12px rgba(14,59,54,.10); --r:12px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--warm-light);color:#333;font-family:Calibri,Arial,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;}
.header{background:var(--petrol);border-bottom:3px solid var(--emer);min-height:70px;display:flex;align-items:center;padding:0 22px;gap:16px;flex-wrap:wrap;}
.divider{width:1px;height:34px;background:rgba(255,255,255,.3);}
.htitle{color:#fff;font-size:17px;font-weight:700;letter-spacing:.2px;}
.hsub{color:#B9CFC9;font-size:11.5px;}
main{width:100%;margin:0 auto;padding:18px clamp(16px,2.2vw,52px) 44px;}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px 14px;margin-bottom:14px;position:sticky;top:0;z-index:15;}
.wsel select{font-family:inherit;font-size:13.5px;font-weight:700;color:var(--sage);border:1px solid var(--warm);border-radius:8px;padding:7px 12px;background:#fff;cursor:pointer;}
.modesel{display:inline-flex;background:var(--warm-light);border-radius:8px;padding:3px;gap:2px;}
.modesel .mbtn{background:none;border:none;color:var(--stone);padding:6px 14px;font-family:inherit;font-size:13px;font-weight:700;border-radius:6px;cursor:pointer;}
.modesel .mbtn.active{background:var(--sage);color:#fff;box-shadow:var(--sh);}
.bar a.btnlink{background:#fff;border:1px solid var(--warm);color:var(--sage);font-size:12.5px;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:700;}
.bar a.btnlink:hover{border-color:var(--sage);}
.spacer{margin-left:auto;}

.err{display:none;background:#FBE9E9;border:1px solid var(--rose);border-radius:8px;padding:12px 16px;color:#DC2626;font-size:13px;margin-bottom:16px;}
.vacio{color:var(--stone);font-size:13px;padding:30px 0;text-align:center;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px;}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:0;position:relative;overflow:hidden;transition:box-shadow .15s,transform .15s;}
.kpi:hover{box-shadow:var(--sh-h);transform:translateY(-1px);}
.kpi .banda{display:block;height:5px;background:var(--sage);}
.kpi.neg .banda{background:var(--rose);}
.kpi.money .banda{background:var(--taupe);}
.kpi .cuerpo{padding:14px 16px 16px;}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--stone);}
.kpi .v{font-size:28px;font-weight:700;line-height:1.15;color:var(--sage);letter-spacing:-.5px;margin-top:6px;}
.kpi.neg .v{color:var(--rose);} .kpi.money .v{color:var(--taupe);}
.kpi .s{font-size:11px;color:var(--stone);margin-top:5px;}
/* Protagonista: fondo Petróleo */
.kpi.hero{background:var(--petrol);}
.kpi.hero .banda{background:var(--emer);}
.kpi.hero .l{color:#8FB3AC;}
.kpi.hero .v{color:#fff;font-size:34px;}
.kpi.hero .s{color:#8FB3AC;}

.sectitle{font-size:17px;font-weight:700;color:var(--sage-dark);margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--warm-light);}
.note{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 16px;margin-top:18px;font-size:13px;}
.note summary{cursor:pointer;font-weight:700;color:var(--sage-dark);}
.note p{color:var(--stone);margin:8px 0 0;line-height:1.55;}
.note p b{color:var(--sage-dark);}

.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 18px 16px;margin-bottom:18px;position:relative;overflow:hidden;}
.panel .tira{position:absolute;left:0;right:0;top:0;height:4px;background:var(--warm);}
.panel .tira.resultado{background:var(--sage);}
.panel .tira.dinero{background:var(--taupe);}
.panel .pt{font-size:15px;font-weight:700;color:#333;}
.panel .ph{font-size:11.5px;color:var(--stone);margin-top:2px;margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}
.cwrap{position:relative;width:100%;min-height:220px;}
.cwrap canvas{position:absolute;inset:0;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
table th{background:var(--warm-light);color:var(--petrol);text-align:left;padding:8px 9px;font-weight:700;border-bottom:2px solid var(--warm);position:sticky;top:0;}
table td{padding:7px 9px;border-bottom:1px solid var(--warm-light);}
table tr:hover td{background:#FAFCFB;}
.ef-alta{color:var(--sage);font-weight:700;}
.ef-baja{color:var(--rose);font-weight:700;}
.dif-pos{color:var(--sage);font-weight:700;}
.dif-neg{color:var(--rose);font-weight:700;}
.chip-tipo{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--warm-light);color:var(--stone);}
.tabla-scroll{max-height:520px;overflow-y:auto;overflow-x:auto;}

@media(min-width:1700px){
  .kpis{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
}

@media(max-width:600px){
  .header{padding:0 16px;min-height:60px;}
  .header img{height:32px;}
  main{padding:14px 14px 32px;}
  .bar{padding:10px;gap:8px;position:static;}
  .bar>*{flex:none;}
  .wsel select,.btnlink,.mbtn{min-height:40px;}
  .kpis{grid-template-columns:1fr;gap:10px;}
  .kpi .v{font-size:24px;} .kpi.hero .v{font-size:28px;}
  .kpi:hover{transform:none;box-shadow:var(--sh);}
  .sectitle{font-size:15px;margin:20px 0 10px;}
  .panel{padding:16px 12px 12px;}
  table{min-width:640px;}
}

@media print{
  @page{size:A4 landscape;margin:9mm;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  .bar,.err{display:none!important;}
  body{background:#fff!important;}
  main{padding:0;}
  .panel,.kpi{box-shadow:none;border:1px solid var(--warm);break-inside:avoid;}
  .kpi.hero{background:#fff!important;}
  .kpi.hero .v{color:var(--sage)!important;}
  .kpi.hero .l,.kpi.hero .s{color:var(--stone)!important;}
  .cwrap{height:220px!important;}
}
</style>
</head>

<script>
  const $ = id => document.getElementById(id);
  let FILAS_SEMANA = [];
  let TIPO_ACTIVO = '';
  let chartEf = null, chartInc = null;

  Chart.defaults.font.family = "Calibri, Arial, sans-serif";
  Chart.defaults.font.size = 12;
  Chart.defaults.color = "#5F726C";
  Chart.defaults.borderColor = "#F1F6F4";
  Chart.defaults.plugins.tooltip.backgroundColor = "rgba(51,51,51,0.95)";
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.cornerRadius = 4;

  // ------- Supabase (reemplaza al Apps Script; la sesión la pone el bloque lives-sesion) -------
  const SB_URL = 'https://xxfufpddgoyhbotjmaiy.supabase.co';
  const PENDIENTES = {};   // token por guardado: un reintento del mismo guardado no duplica
  function nuevoToken(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)); }
  async function api(accion, p) {
    // Un reintento si falla la red; nunca deja la pantalla bloqueada.
    for (let i = 0; i < 2; i++) {
      try {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
        const r = await fetch(SB_URL + '/rest/v1/rpc/corte_api', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_accion: accion, p: p || {} }), signal: ctl.signal });
        clearTimeout(t);
        const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
        if (r.ok) return j;
        const err = new Error((j && (j.message || j.hint)) || ('Error ' + r.status)); err.servidor = true; throw err;
      } catch (e) {
        if (e.servidor || i === 1) throw (e.servidor ? e : new Error('No hay conexión con la base de datos. Revisa la señal y vuelve a intentar: no se perdió nada de lo escrito.'));
        await new Promise(ok => setTimeout(ok, 1500));
      }
    }
  }
  // Misma forma de respuesta que tenía el Apps Script ({ok, data} / {ok:false, error}).
  async function llamarApi(params) {
    const { action, ...resto } = params; const p = {};
    Object.keys(resto).forEach(k => {
      let v = resto[k];
      if (typeof v === 'string' && /^\s*[\[{]/.test(v)) { try { v = JSON.parse(v); } catch (e) {} }
      if (v !== '' && v !== undefined) p[k] = v;
    });
    if (action.indexOf('guardar') === 0) {
      const firma = JSON.stringify(p);
      if (!PENDIENTES[action] || PENDIENTES[action].firma !== firma) PENDIENTES[action] = { firma, token: nuevoToken() };
      p.token = PENDIENTES[action].token;
    }
    try {
      const data = await api(action, p);
      if (action.indexOf('guardar') === 0) delete PENDIENTES[action];
      if (data && data.personas !== undefined && data.operarios === undefined) data.operarios = data.personas;
      return { ok: true, data };
    } catch (e) { return { ok: false, error: e.message }; }
  }

  function mostrarError(msg) {
    const el = $('err'); el.textContent = msg; el.style.display = 'block';
  }

  // ------- Filtro por tipo de registro -------
  document.querySelectorAll('#filtro-tipo .mbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#filtro-tipo .mbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      TIPO_ACTIVO = btn.dataset.tipo;
      renderTodo();
    });
  });

  // ------- Cargar lista de semanas -------
  async function cargarSemanas() {
    try {
      const res = await llamarApi({ action: 'semanasDisponibles' });
      if (!res.ok) { mostrarError('No se pudieron cargar las semanas: ' + res.error); return; }
      const semanas = res.data;
      if (!semanas.length) {
        $('contenido').innerHTML = '<div class="vacio">Todavía no hay datos calculados. Guarda al menos un registro desde el formulario.</div>';
        $('sel-semana').style.display = 'none';
        return;
      }
      $('sel-semana').innerHTML = semanas.map(s => `<option value="${s}">Semana ${s}</option>`).join('');
      $('sel-semana').addEventListener('change', cargarSemanaActual);
      await cargarSemanaActual();
    } catch (e) {
      mostrarError('Error de conexión al cargar semanas: ' + e.message);
    }
  }

  async function cargarSemanaActual() {
    const semana = $('sel-semana').value;
    $('contenido').innerHTML = '<div class="vacio">Cargando datos de la semana ' + semana + '…</div>';
    try {
      const res = await llamarApi({ action: 'resumenSemana', semana });
      if (!res.ok) { mostrarError('Error al cargar la semana: ' + res.error); return; }
      FILAS_SEMANA = res.data.filas || [];
      construirLayout();
      renderTodo();
    } catch (e) {
      mostrarError('Error de conexión: ' + e.message);
    }
  }

  // ------- Layout fijo (se construye una vez que hay datos) -------
  function construirLayout() {
    $('contenido').innerHTML = `
      <div class="kpis" id="kpis"></div>

      <div class="sectitle">Comparativo Real vs. Sistema</div>
      <div class="grid2">
        <div class="panel"><span class="tira resultado"></span>
          <div class="pt">Eficiencia % por colaborador</div>
          <div class="ph">Real (digitado) vs. Sistema (oficial)</div>
          <div class="cwrap" id="cwrap-ef"><canvas id="chart-ef"></canvas></div>
        </div>
        <div class="panel"><span class="tira dinero"></span>
          <div class="pt">Incentivo S/ por colaborador</div>
          <div class="ph">Real vs. Sistema — la diferencia es lo que el sistema no está pagando (o está pagando de más)</div>
          <div class="cwrap" id="cwrap-inc"><canvas id="chart-inc"></canvas></div>
        </div>
      </div>

      <div class="sectitle">Detalle por trabajador</div>
      <div class="panel">
        <div class="tabla-scroll">
        <table>
          <thead><tr>
            <th>Colaborador</th><th>Tipo</th><th>Días</th>
            <th>Min.Prod</th><th>Min.Trab</th>
            <th>EF Real</th><th>EF Sistema</th>
            <th>Inc.Real S/</th><th>Inc.Sistema S/</th><th>Diferencia S/</th>
          </tr></thead>
          <tbody id="tabla-body"></tbody>
        </table>
        </div>
      </div>

      <details class="note" open>
        <summary>¿Cómo leo este tablero?</summary>
        <p><b>EF Real %</b> = suma de minutos producidos ÷ suma de minutos trabajados, de la semana elegida — promedio <b>ponderado</b>, nunca promedio simple de porcentajes diarios.</p>
        <p><b>Real</b> es lo digitado y calculado en este sistema (formulario de Estefani); <b>Sistema</b> es lo que reporta el sistema oficial de la empresa. La diferencia es la señal de subregistro o sobreregistro.</p>
        <p><b>Incentivo S/</b> sale de la tabla de incentivos por % de eficiencia y básico de cada colaborador (categoría A/B/C/Y). Por debajo de 55% de eficiencia no hay incentivo; desde 90% el % se satura en 71%.</p>
        <p>El filtro "Manual / Corte Paño / Módulos" recalcula los KPI, los gráficos y la tabla solo con ese tipo de registro.</p>
      </details>
    `;
  }

  function filasFiltradas() {
    return TIPO_ACTIVO ? FILAS_SEMANA.filter(f => f.tipo === TIPO_ACTIVO) : FILAS_SEMANA;
  }

  function renderTodo() {
    if (!$('kpis')) return; // layout aún no construido
    const filas = filasFiltradas();
    renderKpis(filas);
    renderCharts(filas);
    renderTabla(filas);
  }

  // ------- KPIs (ponderados) -------
  function renderKpis(filas) {
    if (!filas.length) {
      $('kpis').innerHTML = '<div class="vacio">Sin datos para este filtro.</div>';
      return;
    }
    const sumMinProd = filas.reduce((a, f) => a + (f.minProducido || 0), 0);
    const sumMinTrab = filas.reduce((a, f) => a + (f.minTrabajado || 0), 0);
    const efRealPond = sumMinTrab > 0 ? (sumMinProd / sumMinTrab) * 100 : 0;
    const efSistPond = sumMinTrab > 0 ? filas.reduce((a, f) => a + (f.efSist || 0) * (f.minTrabajado || 0), 0) / sumMinTrab : 0;
    const incReal = filas.reduce((a, f) => a + (f.incReal || 0), 0);
    const incSist = filas.reduce((a, f) => a + (f.incSist || 0), 0);
    const diferencia = incReal - incSist;

    $('kpis').innerHTML = `
      <div class="kpi hero">
        <span class="banda"></span>
        <div class="cuerpo">
          <div class="l">EF Real (ponderada)</div>
          <div class="v">${efRealPond.toFixed(1)}%</div>
          <div class="s">${filas.length} colaboradores</div>
        </div>
      </div>
      <div class="kpi">
        <span class="banda"></span>
        <div class="cuerpo">
          <div class="l">EF Sistema (ponderada)</div>
          <div class="v">${efSistPond.toFixed(1)}%</div>
        </div>
      </div>
      <div class="kpi money">
        <span class="banda"></span>
        <div class="cuerpo">
          <div class="l">Incentivo Real total</div>
          <div class="v">S/ ${incReal.toFixed(2)}</div>
        </div>
      </div>
      <div class="kpi money">
        <span class="banda"></span>
        <div class="cuerpo">
          <div class="l">Incentivo Sistema total</div>
          <div class="v">S/ ${incSist.toFixed(2)}</div>
        </div>
      </div>
      <div class="kpi ${diferencia < 0 ? 'neg' : ''}">
        <span class="banda"></span>
        <div class="cuerpo">
          <div class="l">Diferencia (Real − Sistema)</div>
          <div class="v">${diferencia >= 0 ? '+' : ''}S/ ${diferencia.toFixed(2)}</div>
        </div>
      </div>
    `;
  }

  // ------- Gráficos comparativos -------
  function renderCharts(filas) {
    const ordenadas = [...filas].sort((a, b) => (b.diferencia || 0) - (a.diferencia || 0));
    const nombres = ordenadas.map(f => f.nombre.split(',')[0]); // solo apellido, para que quepa
    const alto = Math.max(220, ordenadas.length * 24);
    $('cwrap-ef').style.height = alto + 'px';
    $('cwrap-inc').style.height = alto + 'px';

    if (chartEf) chartEf.destroy();
    if (chartInc) chartInc.destroy();

    chartEf = new Chart($('chart-ef'), {
      type: 'bar',
      data: {
        labels: nombres,
        datasets: [
          { label: 'EF Real %', data: ordenadas.map(f => f.efReal || 0), backgroundColor: '#0F7A5A', borderRadius: 3, barThickness: 12 },
          { label: 'EF Sistema %', data: ordenadas.map(f => f.efSist || 0), backgroundColor: '#4E6B78', borderRadius: 3, barThickness: 12 }
        ]
      },
      options: {
        indexAxis: 'y', maintainAspectRatio: false, responsive: true,
        scales: {
          x: { min: 0, grid: { color: '#F1F6F4' }, border: { color: '#DCE5E2' }, ticks: { callback: v => v + '%' } },
          y: { grid: { display: false } }
        },
        plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } }
      }
    });

    chartInc = new Chart($('chart-inc'), {
      type: 'bar',
      data: {
        labels: nombres,
        datasets: [
          { label: 'Incentivo Real S/', data: ordenadas.map(f => f.incReal || 0), backgroundColor: '#0F7A5A', borderRadius: 3, barThickness: 12 },
          { label: 'Incentivo Sistema S/', data: ordenadas.map(f => f.incSist || 0), backgroundColor: '#4E6B78', borderRadius: 3, barThickness: 12 }
        ]
      },
      options: {
        indexAxis: 'y', maintainAspectRatio: false, responsive: true,
        scales: {
          x: { min: 0, grid: { color: '#F1F6F4' }, border: { color: '#DCE5E2' }, ticks: { callback: v => 'S/' + v } },
          y: { grid: { display: false } }
        },
        plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } }
      }
    });
  }

  // ------- Tabla de detalle -------
  const NOMBRE_TIPO = { MANUAL: 'Manual', CORTE_PAÑO: 'Corte Paño', MODULO: 'Módulo' };
  function renderTabla(filas) {
    const ordenadas = [...filas].sort((a, b) => a.nombre.localeCompare(b.nombre));
    $('tabla-body').innerHTML = ordenadas.map(f => `
      <tr>
        <td>${f.nombre}</td>
        <td><span class="chip-tipo">${NOMBRE_TIPO[f.tipo] || f.tipo}</span></td>
        <td>${f.diasTrabajados}</td>
        <td>${Math.round(f.minProducido || 0)}</td>
        <td>${Math.round(f.minTrabajado || 0)}</td>
        <td class="${(f.efReal || 0) >= 55 ? 'ef-alta' : 'ef-baja'}">${(f.efReal || 0).toFixed(1)}%</td>
        <td>${(f.efSist || 0).toFixed(1)}%</td>
        <td>${(f.incReal || 0).toFixed(2)}</td>
        <td>${(f.incSist || 0).toFixed(2)}</td>
        <td class="${(f.diferencia || 0) >= 0 ? 'dif-pos' : 'dif-neg'}">${(f.diferencia || 0) >= 0 ? '+' : ''}${(f.diferencia || 0).toFixed(2)}</td>
      </tr>
    `).join('');
  }

  cargarSemanas();

</script>
</body>
</html>
